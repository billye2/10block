<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>10block — promo tiles</title>
<link rel="stylesheet" href="common.css" />
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0; }

  /* Chrome Web Store promo tile sizes. */
  .tile-small { width: 440px; height: 280px; }
  .tile-marquee { width: 1400px; height: 560px; }

  /* ---- small tile: mark-forward, readable when scaled down ---- */
  .tile-small .inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 28px;
    text-align: center;
  }
  .tile-small .mark { width: 84px; height: 84px; display: block; }
  .tile-small .name { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .tile-small .name .accent { color: var(--orange); }
  .tile-small .tag { font-size: 16px; font-weight: 500; color: #a6abbe; line-height: 1.35; }

  /* ---- marquee: message left, countdown bleeding in from the right ----
     The countdown sits in its own layer offset to the right, with one veil
     across the WHOLE tile. Veiling only the right half left a visible vertical
     seam where the iframe's background met the tile's. */
  .tile-marquee .bleed-art { position: absolute; left: 400px; top: 0; width: 1000px; height: 100%; }
  .tile-marquee .bleed-art iframe { width: 100%; height: 100%; border: 0; display: block; }
  .tile-marquee .veil {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg,
      var(--deep) 0%, var(--deep) 41%,
      rgba(11, 13, 20, 0.74) 53%,
      rgba(11, 13, 20, 0.16) 69%,
      rgba(11, 13, 20, 0) 82%);
  }

  /* Sits above the veil — the veil is opaque on the left, which would
     otherwise flatten the frame's own glow to dead black. */
  .tile-marquee .glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 760px 520px at 16% -18%, rgba(99, 102, 241, 0.17), rgba(0, 0, 0, 0) 70%);
  }

  .tile-marquee .inner { position: relative; height: 100%; display: flex; align-items: center; }

  .marq-left { width: 800px; padding: 0 0 0 88px; flex-shrink: 0; }
  .marq-left .wordmark { margin-bottom: 34px; }
  .marq-left .wordmark img { width: 56px; height: 56px; }
  .marq-left .wordmark .text { font-size: 40px; }
  .marq-left h1 {
    font-size: 62px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.04;
  }
  .marq-left h1 .em { color: var(--orange); }
  .marq-left p {
    margin-top: 20px;
    font-size: 22px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.45;
    max-width: 600px;
  }

</style>
</head>
<body>

<!-- ============ small promo tile · 440x280 ============ -->
<div class="frame tile-small" id="tile-small">
  <div class="inner">
    <img class="mark" src="/src/icons/icon128.png" alt="" />
    <div class="name">10<span class="accent">block</span></div>
    <div class="tag">Pause any site for 10 minutes.<br />No early unblock.</div>
  </div>
</div>

<!-- ============ marquee promo tile · 1400x560 ============ -->
<div class="frame tile-marquee" id="tile-marquee">
  <div class="bleed-art">
    <iframe src="blocked-frame.html?domain=youtube.com&timer=8:42&freeze=6"></iframe>
  </div>
  <div class="veil"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="marq-left">
      <div class="wordmark">
        <img src="/src/icons/icon128.png" alt="" />
        <span class="text">10<span class="accent">block</span></span>
      </div>
      <h1>10 minutes to<br />change your <span class="em">mind</span>.</h1>
      <p>One click pauses the site you're on. It comes back on its own — and not a second sooner.</p>
    </div>
  </div>
</div>

</body>
</html>
