<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paused — Block Site</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="scene">
    <div class="breath-ring"></div>
    <div class="content">
      <div class="domain" id="domain">&nbsp;</div>
      <div class="timer" id="timer">10:00</div>
      <div class="breath-guide">
        <span class="breath-phase" id="breath-phase">Inhale</span>
        <span class="breath-count" id="breath-count">4</span>
      </div>
      <p class="message">Take a breath. This site is paused.</p>
      <p class="submessage">It'll be back when the timer runs out.</p>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
